name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Install Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TVC_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TVC_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TVC_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TVC_KEY_PASSWORD }}
        run: |
          for v in KEYSTORE_BASE64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret TVC_$v"; exit 1; fi
          done
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TVC_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew --no-daemon :shared:test :phone:testDebugUnitTest :agent:testDebugUnitTest :phone:lintDebug :agent:lintDebug

      - name: Build release APKs
        env:
          ORG_GRADLE_PROJECT_TVC_STORE_PASSWORD: ${{ secrets.TVC_STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_TVC_KEY_ALIAS: ${{ secrets.TVC_KEY_ALIAS }}
          ORG_GRADLE_PROJECT_TVC_KEY_PASSWORD: ${{ secrets.TVC_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon \
            -PTVC_STORE_FILE="$TVC_STORE_FILE" \
            -PTVC_VERSION_NAME="${GITHUB_REF_NAME#v}" \
            -PTVC_VERSION_CODE="${{ github.run_number }}" \
            :agent:assembleRelease :phone:assembleRelease

      - name: Package assets
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir -p dist/debloat/scripts dist/debloat/debloat
          for app in agent phone; do
            for abi in universal arm64-v8a armeabi-v7a x86 x86_64; do
              cp "$app/build/outputs/apk/release/$app-$abi-release.apk" "dist/tvcompanion-$app-$v-$abi.apk"
            done
          done
          cp scripts/debloat.ps1 dist/debloat/scripts/
          cp debloat/packages.json dist/debloat/debloat/
          (cd dist/debloat && zip -r "../tvcompanion-debloat-$v.zip" .)
          rm -rf dist/debloat
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
